name: Tests

# Runs on every push and pull request, so defects are caught before the code
# reaches a server rather than after.
on:
  push:
    branches: [main]
  pull_request:
  # Lets anyone re-run the suite from the Actions tab without pushing a commit,
  # which matters when a run fails for reasons that have nothing to do with the
  # code, such as the platform being unavailable.
  workflow_dispatch:
  # Weekly, because the support contract commits to weekly updates and a
  # dependency or a WordPress release can break things while nobody is editing
  # this repository.
  schedule:
    - cron: '0 6 * * 1'

# A newer push makes an in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job covering everything that needs no database.
  #
  # Deliberately not split across parallel jobs: each job costs a runner and a
  # cold start, and on a free account queuing several at once means some never
  # get scheduled. Sequential steps inside one job are faster end to end here
  # and easier to read when something fails.
  checks:
    name: Syntax, quick checks and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # Runs first: a parse error makes everything below meaningless.
      - name: Lint every PHP file
        run: find src hilg-vault.php -name '*.php' -print0 | xargs -0 -n1 php -l

      # No dependencies at all. These are the same checks that can be run on a
      # server after an update, when CI is not available.
      - name: Dependency-free checks
        run: php tests/run.php

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # Real classes, stand-in WordPress helpers, no database.
      - name: Unit tests
        run: vendor/bin/phpunit

  # Separate job because it needs a database service, which the job above
  # should not pay for.
  integration:
    name: Integration against real WordPress
    runs-on: ubuntu-latest
    needs: checks

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Pinned to the version the client actually runs.
          php-version: '8.4'
          extensions: mysqli
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # Values reach the shell through the environment rather than being
      # interpolated into the command. These come from the workflow itself and
      # are safe, but interpolating into a run block is a habit worth not
      # having: the day a value comes from an event payload instead, the
      # injection is already written.
      - name: Install the WordPress test library
        env:
          WP_VERSION: latest
          DB_NAME: wordpress_test
          DB_USER: root
          DB_HOST: 127.0.0.1
        run: bash bin/install-wp-tests.sh "$DB_NAME" "$DB_USER" '' "$DB_HOST" "$WP_VERSION" true

      - name: Integration tests
        run: vendor/bin/phpunit -c phpunit-integration.xml.dist
