name: Tests

# Runs on every push and every pull request, which is the point: defects are
# caught before the code reaches a server rather than after.
on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because the support contract commits to weekly updates and a
  # dependency or a WordPress release can break things while nobody is editing
  # this repository.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  quick:
    name: Dependency-free checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      # These need nothing but PHP, so they also run on a server after an
      # update, when CI is not available.
      - name: Run checks
        run: php tests/run.php

  unit:
    name: PHPUnit unit suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # No database and no WordPress: these exercise the real classes against
      # a handful of stand-in helpers, so they run in seconds.
      - name: Run the unit suite
        run: vendor/bin/phpunit

  syntax:
    name: Syntax on every supported PHP version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: |
          find src hilg-vault.php -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

  integration:
    name: WordPress ${{ matrix.wordpress }} on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # The version the client actually runs.
          - php: '8.4'
            wordpress: 'latest'
          # The oldest combination the plugin claims to support.
          - php: '8.2'
            wordpress: '6.5'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # Values reach the shell through the environment rather than being
      # interpolated into the command. These particular ones come from the
      # matrix above and are safe, but interpolating anything into a run block
      # is a habit worth not having: the day one of them comes from an event
      # payload instead, the injection is already written.
      - name: Install the WordPress test library
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          bash bin/install-wp-tests.sh wordpress_test root '' 127.0.0.1 "$WP_VERSION"

      - name: Run the integration suite
        run: vendor/bin/phpunit -c phpunit-integration.xml.dist
